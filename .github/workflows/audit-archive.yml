name: Audit Archive Build

# 请求报文归档（backend/internal/audit + frontend-audit 构建补丁）。
# 产物是“同一个服务”：带前端增强的单一二进制 / 镜像，不新增任何进程或包装服务。

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-audit/**'
      - '.github/workflows/audit-archive.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-audit/**'
      - '.github/workflows/audit-archive.yml'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to GHCR (ghcr.io/<owner>/sub2api-audit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: go version | grep -q 'go1.27.2'
      - name: Vet
        working-directory: backend
        run: go vet ./internal/audit/... ./internal/server/routes/... ./internal/repository/... ./cmd/server/...
      - name: Audit package tests (race)
        working-directory: backend
        run: go test -race -count=1 ./internal/audit/...
      - name: Touched packages (unit)
        working-directory: backend
        run: go test -tags=unit -count=1 ./internal/server/... ./internal/repository/... ./internal/handler/admin/...
      - name: Write-path benchmark (smoke)
        working-directory: backend
        run: go test -run '^$' -bench 'Archive|GatewayOverhead' -benchtime 200x ./internal/audit/

  package:
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend with audit enhancement
        run: ./frontend-audit/build.sh
      - name: Build backend (embedded frontend)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(tr -d '\r\n' < cmd/server/VERSION)-audit"
          go build -tags embed -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA::7} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildType=release" \
            -o ../sub2api ./cmd/server
      - name: Verify enhancement is embedded
        run: |
          grep -a -q 'sub2api-audit-ui' sub2api
          grep -a -q 'audit-archive' sub2api
      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-audit-linux-${{ matrix.goarch }}
          path: sub2api
          retention-days: 14
      - name: Set up Docker Buildx
        if: matrix.goarch == 'amd64'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: matrix.goarch == 'amd64' && github.event_name == 'workflow_dispatch' && inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (same service, prebuilt binary)
        if: matrix.goarch == 'amd64'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker build -f Dockerfile.goreleaser -t "ghcr.io/${owner}/sub2api-audit:${GITHUB_SHA::7}" .
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_image }}" = "true" ]; then
            docker push "ghcr.io/${owner}/sub2api-audit:${GITHUB_SHA::7}"
          fi
